name: Build Linux AMD64 and macOS ARM64
run-name: Packages · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-binaries.yml"
      - "codex-rs/**"
      - "scripts/codex_package/**"

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libssl-dev \
            libasound2-dev libudev-dev cmake ninja-build clang

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf

      - name: Install Zig for musl native dependencies
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Configure musl toolchain and static libcap
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          DEBIAN_FRONTEND: noninteractive
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        run: bash .github/scripts/install-musl-build-tools.sh

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just,cargo-nextest

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
            ${{ runner.temp }}/codex-package
          key: packages-v1-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            packages-v1-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-

      - name: Check package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      # The package builder verifies the matching prebuilt V8 artifacts and
      # includes runtime resources such as ripgrep and Linux bubblewrap.
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE_NAME: ${{ matrix.name }}
          TMPDIR: ${{ runner.temp }}
        run: |
          echo "Building commit $(git rev-parse HEAD)"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --cargo-profile release \
            --package-dir "dist/$PACKAGE_NAME" \
            --archive-output "dist/codex-$PACKAGE_NAME.tar.gz" \
            2>&1 | tee "build-$PACKAGE_NAME.log"

      - name: Verify static Linux executables and older system compatibility
        if: runner.os == 'Linux'
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          {
            for binary in "dist/$PACKAGE_NAME/bin/codex" \
              "dist/$PACKAGE_NAME/codex-resources/bwrap" \
              "dist/$PACKAGE_NAME/codex-path/rg"; do
              file "$binary"
              metadata="$(readelf --program-headers --dynamic --version-info --wide "$binary")"
              if grep -Eq 'INTERP|\(NEEDED\)|GLIBC_[0-9]' <<< "$metadata"; then
                echo "::error::$binary still depends on a dynamic loader or shared libraries"
                echo "$metadata"
                exit 1
              fi
            done
            for image in ubuntu:20.04 alpine:3.20; do
              docker run --rm --network none \
                -v "$PWD/dist/$PACKAGE_NAME:/opt/codex:ro" "$image" \
                /bin/sh -ec '/opt/codex/bin/codex --version; /opt/codex/bin/codex login grok --help; /opt/codex/codex-path/rg --version; /opt/codex/codex-resources/bwrap --version'
            done
          } 2>&1 | tee compatibility.log

      - name: Test Grok account authentication
        env:
          TARGET: ${{ matrix.target }}
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/grok-test-env"
          import os
          import sys
          sys.path.insert(0, "scripts")
          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import resolve_codex_v8_cargo_env
          import shlex
          for key, value in resolve_codex_v8_cargo_env(TARGET_SPECS[os.environ["TARGET"]]).items():
              print(f"export {key}={shlex.quote(value)}")
          PY
          source "$RUNNER_TEMP/grok-test-env"
          just test --target "$TARGET" --cargo-profile release -p codex-login --lib -E 'test(grok)' 2>&1 | tee grok-tests.log
          just test --target "$TARGET" --cargo-profile release -p codex-cli --test login -E 'test(grok)' 2>&1 | tee -a grok-tests.log

      - name: Smoke test CLI
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          "dist/$PACKAGE_NAME/bin/codex" --version
          "dist/$PACKAGE_NAME/bin/codex" login grok --help

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.name }}
          path: dist/codex-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-log-${{ matrix.name }}
          path: |
            build-${{ matrix.name }}.log
            grok-tests.log
            compatibility.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize failure
        if: failure()
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Failure details: {os.environ['PACKAGE_NAME']}\n")
              for path in [Path(f"build-{os.environ['PACKAGE_NAME']}.log"), Path("grok-tests.log"), Path("compatibility.log")]:
                  if path.exists():
                      tail = "\n".join(path.read_text(errors="replace").splitlines()[-120:])[-30000:]
                      summary.write(f"### {path.name}\n\n````text\n{tail}\n````\n")
          PY

      - name: Save build cache
        if: always() && !cancelled() && steps.cache.outcome == 'success'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
            ${{ runner.temp }}/codex-package
          key: ${{ steps.cache.outputs.cache-primary-key }}
